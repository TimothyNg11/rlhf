[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-math"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "math-verify",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "torch", "matplotlib"]
gpu = ["vllm>=0.8.0", "torch", "transformers", "datasets", "wandb"]

[tool.setuptools.packages.find]
where = ["src"]
