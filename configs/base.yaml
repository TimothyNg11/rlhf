run_name: base
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
train:
  # 2x the DeepScaleR 1.5B recipe's 1e-6: smaller model, short run (docs/PLAN.md v3)
  lr: 2.0e-6
  optimizer: adamw
  lr_schedule: constant
  prompts_per_step: 64
  ppo_mini_batch_size: 32
  clip_ratio: 0.2
  kl_coef: 0.001
  kl_loss_type: low_var_kl
  entropy_coef: 0.0
  loss_agg: token_mean
  advantage: group_norm        # (r - group_mean) / (group_std + 1e-4)
  skip_zero_variance_groups: true
  truncation_mode: zero_reward
  grad_checkpointing: true
  seed: 0
  # 2, not 8: the logprob forward materializes fp32 [B, T, V] tensors over
  # Qwen's 152k vocab; at ~3.5k padded tokens, B=8 OOMs an 80 GB card.
  micro_batch_size: 2
  format_bonus: 0.2
  max_grad_norm: 1.0
  save_every: 80
  # Truncated importance sampling: correct the rollout(vLLM)-vs-recompute(HF)
  # distribution mismatch. Because old-logprobs are recomputed with HF (never
  # the sampler), the PG ratio does NOT see the backend gap, so it must be
  # corrected here or the off-policy bias compounds into an entropy blow-up
  # (Yao et al. 2025; TRL's default vllm_importance_sampling_correction). G1
  # traced our blow-up to its absence; cap is verl's typical 1.5-5.0 range.
  use_tis: true
  tis_cap: 2.0
rollout:
  group_size: 4
  # 0.6 (the 1.5B recipe value) is too cold for exploration at 0.5B; deviation
  # documented in docs/PLAN.md v3.
  temperature: 0.9
  top_p: 1.0
  max_prompt_tokens: 512
  max_response_tokens: 3072
  gpu_memory_utilization: 0.6
data:
  dataset: openai/gsm8k
  # Last 500 train problems held out as dev: drives in-loop eval + early stopping.
  # GSM8K test is touched only at milestone/final evals.
  dev_holdout: 500
  curriculum: random
eval_during_training:
  every_steps: 25
  benchmarks: [gsm8k_dev]
  k: {gsm8k_dev: 2}
  temperature: 0.6
  top_p: 0.95
  max_tokens: 3072
  seed: 0
