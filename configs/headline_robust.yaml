inherit: g1_robust.yaml
run_name: headline_robust
# The W4 headline run: the stabilized g1_robust recipe (lr 1e-6, KL 0.003,
# truncation mask, entropy stop-loss) extended to the full 400 steps. The
# plan's original binding recipe (2e-6 / KL 0.001 / zero_reward) is superseded
# because it triggers the entropy runaway (docs/g1_diagnosis.md); this recipe
# trained stably to 100 steps with dev pass@1 57.6% -> 63.6%.
#
# save_every 80 (from base) => checkpoints at 80/160/240/320/400, exactly the
# 5 the final eval sweep needs. The entropy stop-loss (2.0) guards the longer
# horizon; watch for the mild late-run entropy creep seen at 100 steps.
max_steps: 400
